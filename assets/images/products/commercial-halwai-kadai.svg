<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <radialGradient id="kadai-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#020617" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kadai-metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="20%" stop-color="#94A3B8"/>
      <stop offset="40%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#E2E8F0"/>
      <stop offset="85%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="kadai-handle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <ellipse cx="250" cy="350" rx="150" ry="18" fill="url(#kadai-shadow)"/>

  <!-- Kadai Body -->
  <path d="M 80 180 C 80 320, 420 320, 420 180 Z" fill="url(#kadai-metal)"/>

  <!-- Inner Curved Cavity -->
  <ellipse cx="250" cy="180" rx="170" ry="38" fill="#475569"/>
  <ellipse cx="250" cy="182" rx="164" ry="34" fill="url(#kadai-metal)"/>

  <!-- Heavy Riveted Solid Forged Handles -->
  <!-- Left Handle -->
  <path d="M 86 172 C 32 140, 24 220, 84 195" stroke="url(#kadai-handle)" stroke-width="18" stroke-linecap="round" fill="none"/>
  <circle cx="92" cy="178" r="6.5" fill="#0F172A"/>
  <circle cx="92" cy="195" r="6.5" fill="#0F172A"/>

  <!-- Right Handle -->
  <path d="M 414 172 C 468 140, 476 220, 416 195" stroke="url(#kadai-handle)" stroke-width="18" stroke-linecap="round" fill="none"/>
  <circle cx="408" cy="178" r="6.5" fill="#0F172A"/>
  <circle cx="408" cy="195" r="6.5" fill="#0F172A"/>

  <!-- Specular Curve -->
  <path d="M 235 186 Q 265 240 280 295 Q 260 297 245 295 Q 230 240 215 186 Z" fill="#FFFFFF" opacity="0.32"/>

  <!-- Brand Stamped Hallmark -->
  <rect x="205" y="245" width="90" height="26" rx="5" fill="#0F172A" opacity="0.18"/>
  <text x="250" y="258" font-family="'Poppins', sans-serif" font-weight="900" font-size="9" fill="#1E293B" text-anchor="middle" letter-spacing="1">MAAR METALS</text>
  <text x="250" y="267" font-family="'Inter', sans-serif" font-weight="700" font-size="6.5" fill="#334155" text-anchor="middle" letter-spacing="1">HALWAI HEAVY G10</text>
</svg>
